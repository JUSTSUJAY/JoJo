<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TicJo</title>
    <link rel="icon" href="https://favicongenerator.s3.amazonaws.com/d973f43d82cfe.png" type="image/png">

    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&display=swap" rel="stylesheet">
    
</head>
<body>
    <main class="app">
        <aside class="sidebar">
            <div>
                <p class="kicker"><span></span>Tic tac toe agent</p>
                <h1>JoJo</h1>
                <p class="subtitle">Play against a reinforcement-learning agent trained with Monte Carlo Tree Search.</p>
                <div id="game-status">Press Start to begin!</div>
            </div>

            <div class="sidebar-bottom">
                <div class="controls">
                    <button id="start-button" onclick="startGame()">Start Game</button>
                    <button id="reset-button" onclick="resetGame()">Reset Game</button>
                    <button id="theme-toggle" onclick="toggleTheme()">Toggle Theme</button>
                </div>
            </div>
        </aside>

        <section class="board-wrap">
            <div id="game-board">
                <div class="cell" id="cell0" onclick="handleMove(0)"></div>
                <div class="cell" id="cell1" onclick="handleMove(1)"></div>
                <div class="cell" id="cell2" onclick="handleMove(2)"></div>
                <div class="cell" id="cell3" onclick="handleMove(3)"></div>
                <div class="cell" id="cell4" onclick="handleMove(4)"></div>
                <div class="cell" id="cell5" onclick="handleMove(5)"></div>
                <div class="cell" id="cell6" onclick="handleMove(6)"></div>
                <div class="cell" id="cell7" onclick="handleMove(7)"></div>
                <div class="cell" id="cell8" onclick="handleMove(8)"></div>
                <div id="win-line" aria-hidden="true"></div>
            </div>
        </section>
    </main>

    <div id="result-modal" class="result-modal" aria-hidden="true">
        <div class="result-card" role="dialog" aria-modal="true" aria-labelledby="result-title">
            <p class="kicker"><span></span>Game over</p>
            <h2 id="result-title">You won</h2>
            <button onclick="closeResultModal()">Continue</button>
        </div>
    </div>

    <script src="scripts.js"></script>
    
</body>

</html>
